<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src data:; img-src data:; connect-src 'none'">
  <title>Partitura rítmica</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; overflow: hidden; }
    #scroller { width: 100%; height: 176px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; touch-action: pan-x; }
    #scroller::-webkit-scrollbar { display: none; }
    #score { height: 160px; background: transparent; }
    #marker { position: fixed; top: 24px; height: 112px; width: 2px; pointer-events: none; display: none; }
    svg { display: block; background: transparent; }
  </style>
  <script src="vexflow-bravura-5.0.0.js" defer></script>
  <script src="score.js" defer></script>
</head>
<body><div id="scroller"><div id="score"></div></div><div id="marker" aria-hidden="true"></div></body>
</html>
